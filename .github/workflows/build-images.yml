name: Build ARM64 Images

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: codex-api-manager
            context: .
            dockerfile: ./api-manager/Dockerfile
            cache_scope: api-manager
          - image: codex-runner
            context: .
            dockerfile: ./runner/Dockerfile
            cache_scope: codex-runner

    steps:
      - name: Checkout repository and Codex submodule
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Normalize registry namespace
        id: namespace
        shell: bash
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ steps.namespace.outputs.value }}/${{ matrix.image }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}

      - name: Export Codex binary for slow-registry deployments
        if: matrix.image == 'codex-runner'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./runner/Dockerfile
          target: codex-binary
          platforms: linux/arm64
          outputs: type=local,dest=${{ runner.temp }}/codex-binary
          cache-from: type=gha,scope=codex-runner

      - name: Upload Codex ARM64 binary
        if: matrix.image == 'codex-runner'
        uses: actions/upload-artifact@v4
        with:
          name: codex-arm64-${{ github.sha }}
          path: ${{ runner.temp }}/codex-binary/codex
          retention-days: 3
