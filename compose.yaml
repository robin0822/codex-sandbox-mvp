services:
  codex-api-manager:
    image: ghcr.io/${GITHUB_OWNER}/codex-api-manager:${IMAGE_TAG:-latest}
    container_name: codex-api-manager
    restart: unless-stopped
    ports:
      - "127.0.0.1:18080:8080"
    environment:
      RUNNER_IMAGE: ghcr.io/${GITHUB_OWNER}/codex-runner:${IMAGE_TAG:-latest}
      MAX_ACTIVE_TASKS: "1"
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      DATA_DIR: /data
      HOST_DATA_DIR: /data/codex-mvp
      TASK_TIMEOUT_SECONDS: "180"
      CACHE_CLONE_TIMEOUT_SECONDS: "120"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /data/codex-mvp:/data
    mem_limit: 512m
    cpus: 0.5
